name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Verify Build Output
        run: |
          echo "Build Artifacts:"
          ls -lrt target/
          find . -name "*.war"

      - name: Clean Old WAR
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/deploy
            rm -f /home/ubuntu/deploy/target/*.war

      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.war"
          target: "/home/ubuntu/deploy"
          overwrite: true

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking deployed WAR..."
            find /home/ubuntu/deploy -name "*.war"

            WAR=$(find /home/ubuntu/deploy -name "*.war" | head -1)

            echo "Using WAR: $WAR"

            echo "Stopping any existing application on port 8080..."
            sudo fuser -k 8080/tcp || true
            PID=$(lsof -t -i:8080)
            if [ ! -z "$PID" ]; then
                echo "Force killing process on port 8080: $PID"
                kill -9 $PID || true
            fi

            echo "Starting new application..."
            nohup java -jar "$WAR" > /home/ubuntu/app.log 2>&1 &

            echo "Waiting for application to start..."
            sleep 20

            echo "Running Java Processes:"
            ps -ef | grep java

            echo "Application Logs:"
            tail -50 /home/ubuntu/app.log

